services:
  - type: web
    name: drishtilok-news
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRISHTILOK_STRICT_TLS
        value: "0"
